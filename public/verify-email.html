<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Email Verification - Streakies</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }

  #bg {
    position: fixed;
    inset: 0;
    display: block;
    background: #000;
  }

  .card {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }

  .panel {
    background: rgba(20, 20, 20, 0.75);
    border: 1px solid rgba(188, 237, 26, 0.25);
    border-radius: 16px;
    padding: 48px 36px;
    max-width: 420px;
    width: 100%;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 40px rgba(188, 237, 26, 0.08);
  }

  .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }

  .icon.success { background: rgba(188, 237, 26, 0.15); color: #bced1a; }
  .icon.error { background: rgba(255, 90, 90, 0.15); color: #ff5a5a; }
  .icon.loading {
    background: rgba(188, 237, 26, 0.1);
    border: 3px solid rgba(188, 237, 26, 0.25);
    border-top-color: #bced1a;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  h1 {
    color: #f2f2f2;
    font-size: 22px;
    margin-bottom: 10px;
  }

  p {
    color: #a3a3a3;
    font-size: 14px;
    line-height: 1.5;
  }

  .accent { color: #bced1a; }
</style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="card">
    <div class="panel">
      <div id="icon" class="icon loading"></div>
      <h1 id="title">Verifying your email...</h1>
      <p id="message">Hang tight, this only takes a second.</p>
    </div>
  </div>

<script>
  // Moving dot background
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let dots = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const DOT_COLOR = '#bced1a';
  const DOT_COUNT = Math.floor((window.innerWidth * window.innerHeight) / 9000);

  function makeDot() {
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.6 + 0.6,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      alpha: Math.random() * 0.5 + 0.3,
    };
  }

  for (let i = 0; i < DOT_COUNT; i++) dots.push(makeDot());

  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (const d of dots) {
      d.x += d.vx;
      d.y += d.vy;

      if (d.x < 0) d.x = canvas.width;
      if (d.x > canvas.width) d.x = 0;
      if (d.y < 0) d.y = canvas.height;
      if (d.y > canvas.height) d.y = 0;

      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = DOT_COLOR;
      ctx.globalAlpha = d.alpha;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  tick();

  // Verification call
  const iconEl = document.getElementById('icon');
  const titleEl = document.getElementById('title');
  const messageEl = document.getElementById('message');

  const token = new URLSearchParams(window.location.search).get('token');

  function setState(state, title, message) {
    iconEl.className = 'icon ' + state;
    iconEl.textContent = state === 'success' ? '✓' : state === 'error' ? '✕' : '';
    titleEl.textContent = title;
    messageEl.textContent = message;
  }

  if (!token) {
    setState('error', 'Missing verification token', 'This link is missing its verification token. Please use the link from your email.');
  } else {
    fetch('/api/auth/verify-email?token=' + encodeURIComponent(token))
      .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
      .then(({ ok, data }) => {
        if (ok) {
          setState('success', 'Email verified!', 'Your email has been verified. You can now log in to your account.');
        } else {
          setState('error', 'Verification failed', data.message || 'This verification link is invalid or has expired.');
        }
      })
      .catch(() => {
        setState('error', 'Something went wrong', 'Could not reach the server. Please try again later.');
      });
  }
</script>
</body>
</html>
