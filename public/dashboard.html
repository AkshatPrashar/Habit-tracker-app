<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Streakies</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }

  #bg {
    position: fixed;
    inset: 0;
    display: block;
    background: #000;
  }

  .card {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }

  .panel {
    background: rgba(20, 20, 20, 0.75);
    border: 1px solid rgba(188, 237, 26, 0.25);
    border-radius: 16px;
    padding: 44px 36px;
    max-width: 420px;
    width: 100%;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 40px rgba(188, 237, 26, 0.08);
  }

  h1 {
    color: #bced1a;
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  p {
    color: #a3a3a3;
    font-size: 14px;
    line-height: 1.5;
  }

  #username {
    color: #f2f2f2;
    font-weight: 600;
  }

  .note {
    margin-top: 20px;
    padding: 14px;
    border: 1px dashed rgba(188, 237, 26, 0.25);
    border-radius: 8px;
    font-size: 12px;
  }

  button {
    margin-top: 24px;
    background: transparent;
    color: #ff5a5a;
    border: 1px solid rgba(255, 90, 90, 0.4);
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover {
    background: rgba(255, 90, 90, 0.1);
  }
</style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="card">
    <div class="panel">
      <h1>Streakies</h1>
      <p>Welcome back, <span id="username">...</span>!</p>
      <div class="note">This is a placeholder home screen. Habit tracking features haven't been built yet.</div>
      <button id="logoutBtn">Log Out</button>
    </div>
  </div>

<script>
  // Moving dot background
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let dots = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const DOT_COLOR = '#bced1a';
  const DOT_COUNT = Math.floor((window.innerWidth * window.innerHeight) / 9000);

  function makeDot() {
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.6 + 0.6,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      alpha: Math.random() * 0.5 + 0.3,
    };
  }

  for (let i = 0; i < DOT_COUNT; i++) dots.push(makeDot());

  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (const d of dots) {
      d.x += d.vx;
      d.y += d.vy;

      if (d.x < 0) d.x = canvas.width;
      if (d.x > canvas.width) d.x = 0;
      if (d.y < 0) d.y = canvas.height;
      if (d.y > canvas.height) d.y = 0;

      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = DOT_COLOR;
      ctx.globalAlpha = d.alpha;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  tick();

  // Require login
  const accessToken = localStorage.getItem('accessToken');
  if (!accessToken) {
    window.location.href = '/login';
  } else {
    fetch('/api/auth/me', {
      headers: { Authorization: 'Bearer ' + accessToken },
    })
      .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
      .then(({ ok, data }) => {
        if (ok) {
          document.getElementById('username').textContent = data.data.user.username;
        } else {
          localStorage.removeItem('accessToken');
          localStorage.removeItem('refreshToken');
          window.location.href = '/login';
        }
      })
      .catch(() => {
        window.location.href = '/login';
      });
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    const refreshToken = localStorage.getItem('refreshToken');
    try {
      await fetch('/api/auth/logout', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + accessToken,
        },
        body: JSON.stringify({ refreshToken }),
      });
    } catch (err) {
      // ignore network errors, still clear local session
    }
    localStorage.removeItem('accessToken');
    localStorage.removeItem('refreshToken');
    window.location.href = '/login';
  });
</script>
</body>
</html>
