<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password - Streakies</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }

  #bg {
    position: fixed;
    inset: 0;
    display: block;
    background: #000;
  }

  .card {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }

  .panel {
    background: rgba(20, 20, 20, 0.75);
    border: 1px solid rgba(188, 237, 26, 0.25);
    border-radius: 16px;
    padding: 44px 36px;
    max-width: 420px;
    width: 100%;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 40px rgba(188, 237, 26, 0.08);
  }

  h1 {
    color: #bced1a;
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 6px;
  }

  p.subtitle {
    color: #a3a3a3;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 26px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: left;
  }

  .hidden { display: none; }

  label {
    display: block;
    color: #a3a3a3;
    font-size: 12px;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  input {
    width: 100%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(188, 237, 26, 0.2);
    border-radius: 8px;
    padding: 12px 14px;
    color: #f2f2f2;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: #bced1a;
  }

  input::placeholder {
    color: #555;
  }

  button[type="submit"] {
    margin-top: 8px;
    width: 100%;
    background: #bced1a;
    color: #0a0a0a;
    border: none;
    border-radius: 8px;
    padding: 13px 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  button[type="submit"]:hover {
    opacity: 0.9;
  }

  button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .status {
    margin-top: 16px;
    font-size: 13px;
    min-height: 18px;
  }

  .status.error { color: #ff5a5a; }
  .status.success { color: #bced1a; }

  a.back-link {
    display: inline-block;
    margin-top: 20px;
    color: #a3a3a3;
    font-size: 13px;
    text-decoration: none;
  }

  a.back-link:hover {
    color: #bced1a;
  }
</style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="card">
    <div class="panel">
      <h1>Reset Password</h1>
      <p class="subtitle" id="subtitle">Enter a new password for your account.</p>

      <form id="resetForm">
        <div>
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" placeholder="••••••••" required minlength="6" />
        </div>
        <div>
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6" />
        </div>
        <button type="submit" id="resetBtn">Reset Password</button>
      </form>

      <div id="status" class="status"></div>
      <a href="/login" class="back-link">Back to Log In</a>
    </div>
  </div>

<script>
  // Moving dot background
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let dots = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const DOT_COLOR = '#bced1a';
  const DOT_COUNT = Math.floor((window.innerWidth * window.innerHeight) / 9000);

  function makeDot() {
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.6 + 0.6,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      alpha: Math.random() * 0.5 + 0.3,
    };
  }

  for (let i = 0; i < DOT_COUNT; i++) dots.push(makeDot());

  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (const d of dots) {
      d.x += d.vx;
      d.y += d.vy;

      if (d.x < 0) d.x = canvas.width;
      if (d.x > canvas.width) d.x = 0;
      if (d.y < 0) d.y = canvas.height;
      if (d.y > canvas.height) d.y = 0;

      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = DOT_COLOR;
      ctx.globalAlpha = d.alpha;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  tick();

  const form = document.getElementById('resetForm');
  const statusEl = document.getElementById('status');
  const subtitle = document.getElementById('subtitle');
  const token = new URLSearchParams(window.location.search).get('token');

  if (!token) {
    form.classList.add('hidden');
    subtitle.textContent = 'This reset link is missing its token.';
    statusEl.className = 'status error';
    statusEl.textContent = 'Please use the link from your password reset email.';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const btn = document.getElementById('resetBtn');

    statusEl.className = 'status';
    statusEl.textContent = '';

    if (newPassword !== confirmPassword) {
      statusEl.className = 'status error';
      statusEl.textContent = 'Passwords do not match.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Resetting...';

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword }),
      });
      const data = await res.json();

      if (res.ok) {
        statusEl.className = 'status success';
        statusEl.textContent = 'Password reset! Redirecting to log in...';
        form.classList.add('hidden');
        setTimeout(() => { window.location.href = '/login'; }, 1500);
      } else {
        statusEl.className = 'status error';
        statusEl.textContent = data.message || 'This reset link is invalid or has expired.';
      }
    } catch (err) {
      statusEl.className = 'status error';
      statusEl.textContent = 'Could not reach the server. Please try again later.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Reset Password';
    }
  });
</script>
</body>
</html>
